# ── Server ────────────────────────────────────────────────────────
server.port=8080

# ── Database (MySQL) ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/securebank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────────────
# IMPORTANT: Replace with a 64+ character random secret in production!
app.jwt.secret=SecureBankSuperSecretJwtSigningKey2024XYZ1234567890ABCDEF!@#$%^&*
app.jwt.expiration-ms=28800000

# ── CORS ──────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Logging ───────────────────────────────────────────────────────
logging.level.com.securebank=INFO
logging.level.org.springframework.security=WARN
