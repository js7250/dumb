# ─────────────────────────────────────────────────────────────────
# SecureBank API — Application Properties (Dev / H2 profile)
# Switch to application-mysql.properties for production.
# ─────────────────────────────────────────────────────────────────

server.port=8080
spring.application.name=securebank-api

# ── H2 In-Memory Database ────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:securebank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ──────────────────────────────────────────────────────────
# IMPORTANT: Replace this secret with a 256-bit random key in production!
app.jwt.secret=SecureBankSuperSecretKeyForJWTSigning_MustBe256BitsOrMoreInProduction!
app.jwt.expiration-ms=86400000

# ── Logging ──────────────────────────────────────────────────────
logging.level.com.securebank=INFO
logging.level.org.springframework.security=WARN
